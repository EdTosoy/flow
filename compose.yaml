services:
  postgres:
    image: postgres:18@sha256:fc973eb97c9fd04bfa1840e0f510719a584ccb3be8debfe6a4144637a9dfe8cf
    environment:
      POSTGRES_USER: flow_test_admin
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: flow_test
    ports:
      - '127.0.0.1:55432:5432'
    command: ['postgres', '-c', 'fsync=on', '-c', 'synchronous_commit=on']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flow_test_admin -d flow_test']
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-dev:/var/lib/postgresql
volumes:
  postgres-dev:
